<!doctype html>
<html lang="en">

<script>

const svg=c=>'<svg viewBox="0 0 240 480" width="260" height="520" style="display:block">'+c+'</svg>';

function ui(){const o=cur>=2,L=cur===N-1;document.getElementById('ch').style.opacity=o?1:0;document.getElementById('skip').style.opacity=L?0:1;document.getElementById('dots').innerHTML=Array.from({length:N-2},(_,i)=>'<span style="width:'+(i===cur-2?30:9)+'px;height:9px;border-radius:5px;background:'+(i===cur-2?'#FFE680':'rgba(255,255,255,.38)')+';box-shadow:'+(i===cur-2?'0 0 10px rgba(255,210,77,.55)':'none')+';transition:all .3s"></span>').join('');const t=L?"Let's Play!  ▶":'Next  ›';document.getElementById('bt1').textContent=t;document.getElementById('bt2').textContent=t}
function go(n){if(n===cur)return;const o=pg[cur],i=pg[n],my=++tk;pg.forEach(p=>p.getAnimations().forEach(a=>a.cancel()));pg.forEach((p,k)=>{if(k!==cur&&k!==n)p.style.display='none'});i.style.display='block';

[[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.88)'}],[{opacity:0,transform:'scale(1.15)'},{opacity:1,transform:'scale(1)'}]],
[[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-50px)'}],[{opacity:0,transform:'translateY(70px)'},{opacity:1,transform:'translateY(0)'}]]][m];

function clr(){tm.forEach(clearTimeout);tm=[]}
function start(){clr();go(0);tm.push(setTimeout(()=>{if(cur===0)go(1)},2600));tm.push(setTimeout(()=>{if(cur===1)go(2)},6000))}
document.getElementById('nx').onclick=()=>{clr();go(cur===N-1?2:cur+1)};
document.getElementById('skip').onclick=()=>{clr();go(N-1)};
